name: Deploy
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node pipeline/build_data.mjs
      # AI text (R06): fails if any number, cite or named study is not backed by the computed data,
      # or if the data changed since the AI writer context was generated.
      - run: node pipeline/ai_build.mjs --context && git diff --exit-code pipeline/ai/context.json
      - run: node pipeline/ai_build.mjs
      - run: npm ci && npm run test && npm run build
        working-directory: app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
